name: Android APK

# Builds the Movexa Android app (Capacitor) entirely in the cloud — nothing to
# install locally — and publishes the APK as a GitHub Release, so the site's
# "Get App" button (→ releases/latest/download/movexa.apk) always resolves.
#
# Run it: Actions → "Android APK" → Run workflow. It also runs automatically on
# every push to main (doc-only changes are ignored).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

# The release step creates a tag + release, which needs write access to the repo.
permissions:
  contents: write

# Never run two builds of the same ref at once; newer wins.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vite 7 needs Node >= 20.19 / 22.12 — use 22 to stay clear of the floor.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JDK 17: Capacitor 6 generates Gradle 8.2.1 + AGP 8.2.1, which run on
      # JDK 8–20. JDK 21+ is rejected, so 17 is the safe, tested choice.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # The committed package-lock.json was generated on Windows and predates the
      # Capacitor deps; installing against it on Linux produced a corrupt/partial
      # tree (missing vite chunks). Drop it for a clean, coherent install.
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      # npm on the runner sometimes leaves the node_modules/.bin shims without
      # the execute bit → "vite: Permission denied" (exit 127). Restore +x for
      # every locally-installed CLI (vite, cap, capacitor-assets) up front.
      - name: Make local CLIs executable
        run: chmod +x node_modules/.bin/*

      # Build the web app only (skip the sitemap postbuild — not needed in the
      # APK and it would hammer TMDB on every run).
      - name: Build web assets
        run: npx vite build

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      # Best-effort branded icon + splash. If anything here fails the APK still
      # ships (with Capacitor's default icon) rather than failing the build.
      - name: Generate app icon + splash
        continue-on-error: true
        run: |
          node scripts/gen-icons.mjs
          npx capacitor-assets generate --android

      # The native android/ folder is generated fresh above by `cap add android`,
      # so our ad-blocking sources live in the repo (native/android/adblock/) and
      # get copied in here — after sync, before Gradle. This overwrites the
      # generated MainActivity with one that installs the ad-blocking WebViewClient.
      - name: Inject in-app ad blocker (native WebView)
        run: |
          JAVA_DIR="android/app/src/main/java/com/movexa/app"
          mkdir -p "$JAVA_DIR"
          cp native/android/adblock/MainActivity.java        "$JAVA_DIR/MainActivity.java"
          cp native/android/adblock/AdBlockWebViewClient.java "$JAVA_DIR/AdBlockWebViewClient.java"
          cp native/android/adblock/AdHosts.java             "$JAVA_DIR/AdHosts.java"
          echo "Injected ad-block sources into $JAVA_DIR:"
          ls -la "$JAVA_DIR"

      # Stamp the build number into the APK so the app can tell whether it's out
      # of date. Capacitor generates versionCode 1 / versionName "1.0" for every
      # build; without this every APK would look identical and the in-app update
      # prompt (src/lib/updater.js) could never fire. Kept in lockstep with the
      # release tag below: versionName 1.0.<run> ↔ tag v1.0.<run>.
      - name: Stamp app version
        run: |
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode +[0-9]+/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i -E "s/versionName +\"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk movexa.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: movexa-android
          path: movexa.apk
          if-no-files-found: error

      # Publish (or refresh) a versioned release marked "latest", so the stable
      # URL releases/latest/download/movexa.apk always points at this build.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Movexa v1.0.${{ github.run_number }}
          make_latest: true
          files: movexa.apk
          body: |
            Movexa Android app (debug build) — install and open.

            Download **movexa.apk** below. On your phone, allow "Install from
            unknown sources" for your browser/file manager, then tap the file.

            The website's **Get App** button always links here
            (releases/latest/download/movexa.apk).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
